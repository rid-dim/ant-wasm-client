<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Autonomi WebRTC-Direct Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; max-width: 760px;
         margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  fieldset { border: 1px solid #8884; border-radius: 8px; margin-bottom: 1rem; }
  label { display: block; margin-top: .5rem; font-size: .85rem; opacity: .8; }
  input { width: 100%; box-sizing: border-box; padding: .45rem;
          font-family: ui-monospace, monospace; font-size: .85rem; }
  button { padding: .5rem 1.2rem; font-size: 1rem; cursor: pointer; margin-top: .8rem; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace;
         font-size: .8rem; background: #8881; border-radius: 8px;
         padding: .8rem; min-height: 8rem; }
  .ok { color: #2a2; } .err { color: #d33; }
</style>
</head>
<body>
<h1>Autonomi über WebRTC-Direct — ohne Installation</h1>
<p>Diese Seite verbindet sich direkt mit einem ant-node (PQC-Tunnel:
ML-KEM-768 + ML-DSA-65), lädt eine Datei, verifiziert jeden Chunk gegen seine
BLAKE3-Adresse und entschlüsselt sie im Browser.</p>

<fieldset>
  <legend>Verbindung</legend>
  <label>Devnet-Manifest-URL (füllt die Felder automatisch)</label>
  <input id="manifest" value="http://127.0.0.1:8088/api/devnet-manifest.json">
  <button id="load-manifest">Manifest laden</button>
  <label>Node (ip:port)</label>
  <input id="node-addr" placeholder="127.0.0.1:20123">
  <label>Zertifikat-Hash (SHA-256, hex)</label>
  <input id="cert-hash" placeholder="64 hex chars">
  <label>PeerId (hex, für PQ-Identitäts-Pinning)</label>
  <input id="peer-id" placeholder="64 hex chars">
</fieldset>

<fieldset>
  <legend>Download</legend>
  <label>Datei-Adresse (public upload, 64 hex)</label>
  <input id="address" placeholder="Adresse aus Upload oder `ant file upload --public`">
  <button id="download">Verbinden &amp; herunterladen</button>
</fieldset>

<fieldset>
  <legend>Upload</legend>
  <label>Zahlungsweg</label>
  <select id="pay-method">
    <option value="auto">MetaMask, wenn vorhanden — sonst Anvil-Devnet-Account</option>
    <option value="anvil">Immer Anvil-Devnet-Account (kein MetaMask)</option>
    <option value="metamask">Immer MetaMask</option>
  </select>
  <button id="connect-wallet" type="button">MetaMask verbinden &amp; Guthaben zeigen</button>
  <div id="balances" style="font-size:.8rem;opacity:.85;margin-top:.4rem"></div>
  <label>Datei</label>
  <input id="upload-file" type="file">
  <button id="upload">Verbinden &amp; hochladen</button>
</fieldset>

<div id="log">bereit.</div>

<script type="module">
import init, { WasmClient } from "./pkg/ant_wasm_client.js";

const $ = (id) => document.getElementById(id);
const log = (msg, cls) => {
  const line = document.createElement("div");
  if (cls) line.className = cls;
  line.textContent = msg;
  $("log").appendChild(line);
};

await init();
log("WASM geladen.");

$("load-manifest").onclick = async () => {
  try {
    const res = await fetch($("manifest").value);
    const m = await res.json();
    if (!m.webrtc) throw new Error("Manifest hat keine webrtc-Sektion (Devnet mit --webrtc-port starten)");
    $("node-addr").value = m.webrtc.address;
    $("cert-hash").value = m.webrtc.cert_hash;
    $("peer-id").value = m.webrtc.peer_id;
    log(`Manifest geladen: Node ${m.webrtc.address}`, "ok");
  } catch (e) {
    log(`Manifest-Fehler: ${e}`, "err");
  }
};

$("download").onclick = async () => {
  try {
    const [ip, port] = $("node-addr").value.trim().split(":");
    const t0 = performance.now();
    log(`Verbinde zu ${ip}:${port} …`);
    const client = await WasmClient.connect(ip, Number(port), $("cert-hash").value.trim(), $("peer-id").value.trim());
    log(`PQC-Tunnel steht. Node-PeerId: ${client.peer_id}`, "ok");

    const address = $("address").value.trim();
    const peers = JSON.parse(await client.closest_peers_json(address));
    log(`Discovery: ${peers.length} zuständige Nodes (Ports ${peers.map(p => p.port).join(", ")})`);
    log(`Lade ${address} direkt von den zuständigen Peers …`);
    const bytes = await client.download(address);
    const secs = ((performance.now() - t0) / 1000).toFixed(2);
    log(`Fertig: ${bytes.length} Bytes in ${secs}s über ${client.connection_count} Direktverbindungen — verifiziert & entschlüsselt.`, "ok");

    const blob = new Blob([bytes], { type: "application/octet-stream" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `autonomi-${address.slice(0, 8)}.bin`;
    a.textContent = `💾 Datei speichern (${bytes.length} Bytes)`;
    $("log").appendChild(a);
    window.__downloadedBytes = bytes;   // for automated verification
    window.__downloadDone = true;
  } catch (e) {
    log(`Fehler: ${e}`, "err");
    window.__downloadError = String(e);
  }
};

// A MetaMask-free payer for the devnet: sends raw eth_sendTransaction to the
// Anvil RPC from the manifest, using its pre-funded unlocked account. In
// production this same callback would instead call window.ethereum.request.
function makeAnvilPayer(manifest) {
  const rpc = manifest.evm.rpc_url;
  // Derive the funded account address from the manifest key via a throwaway
  // eth_accounts call — Anvil exposes its unlocked accounts.
  return async (to, calldata) => {
    // `to`/`calldata` already carry the 0x prefix from the wasm client.
    const accounts = await rpcCall(rpc, "eth_accounts", []);
    const from = accounts[0];
    const txHash = await rpcCall(rpc, "eth_sendTransaction", [{
      from,
      to: to.startsWith("0x") ? to : "0x" + to,
      data: calldata.startsWith("0x") ? calldata : "0x" + calldata,
      gas: "0x500000",
    }]);
    // Wait for the receipt so the next step sees the state change.
    for (let i = 0; i < 60; i++) {
      const r = await rpcCall(rpc, "eth_getTransactionReceipt", [txHash]);
      if (r && r.status === "0x1") return txHash.replace(/^0x/, "");
      if (r && r.status === "0x0") throw new Error("tx reverted: " + txHash);
      await new Promise(res => setTimeout(res, 250));
    }
    throw new Error("tx not mined: " + txHash);
  };
}
async function rpcCall(rpc, method, params) {
  const res = await fetch(rpc, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params }),
  });
  const j = await res.json();
  if (j.error) throw new Error(method + ": " + JSON.stringify(j.error));
  return j.result;
}

// A MetaMask payer: adds/switches to the devnet's Anvil chain, then signs
// each approve/payForQuotes with the user's selected account. The wasm
// client hands us 0x-prefixed to/calldata, so we pass them straight through.
async function makeMetaMaskPayer(manifest) {
  const eth = window.ethereum;
  if (!eth) throw new Error("kein window.ethereum (MetaMask nicht installiert)");
  const chainIdHex = await rpcCall(manifest.evm.rpc_url, "eth_chainId", []);
  const accounts = await eth.request({ method: "eth_requestAccounts" });
  const from = accounts[0];
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: chainIdHex }] });
  } catch (_) {
    await eth.request({ method: "wallet_addEthereumChain", params: [{
      chainId: chainIdHex,
      chainName: "Autonomi Devnet (Anvil)",
      rpcUrls: [manifest.evm.rpc_url],
      nativeCurrency: { name: "Ether", symbol: "ETH", decimals: 18 },
    }] });
  }
  return async (to, calldata) => {
    const txHash = await eth.request({ method: "eth_sendTransaction", params: [{
      from,
      to: to.startsWith("0x") ? to : "0x" + to,
      data: calldata.startsWith("0x") ? calldata : "0x" + calldata,
    }] });
    const rpc = manifest.evm.rpc_url;
    for (let i = 0; i < 120; i++) {
      const r = await rpcCall(rpc, "eth_getTransactionReceipt", [txHash]);
      if (r && r.status === "0x1") return txHash.replace(/^0x/, "");
      if (r && r.status === "0x0") throw new Error("tx reverted: " + txHash);
      await new Promise(res => setTimeout(res, 250));
    }
    throw new Error("tx not mined: " + txHash);
  };
}

// Choose a payer per the dropdown; "auto" prefers MetaMask when present.
async function choosePayer(manifest) {
  const method = $("pay-method").value;
  if (method === "metamask" || (method === "auto" && window.ethereum)) {
    log("Zahlung über MetaMask.");
    return makeMetaMaskPayer(manifest);
  }
  log("Zahlung über Anvil-Devnet-Account (kein MetaMask).");
  return makeAnvilPayer(manifest);
}

// Show the paying account's ANT (ERC-20 balanceOf) and ETH balances.
$("connect-wallet").onclick = async () => {
  try {
    const manifest = await fetch($("manifest").value).then(r => r.json());
    const rpc = manifest.evm.rpc_url;
    let account;
    if (window.ethereum && $("pay-method").value !== "anvil") {
      const accs = await window.ethereum.request({ method: "eth_requestAccounts" });
      account = accs[0];
    } else {
      account = (await rpcCall(rpc, "eth_accounts", []))[0];
    }
    const eth = await rpcCall(rpc, "eth_getBalance", [account, "latest"]);
    // balanceOf(address) selector 0x70a08231 + 32-byte account
    const call = "0x70a08231" + account.replace(/^0x/, "").padStart(64, "0");
    const ant = await rpcCall(rpc, "eth_call", [{ to: manifest.evm.payment_token_address, data: call }, "latest"]);
    const toDec = (hex) => (BigInt(hex) / 10n ** 18n).toString();
    $("balances").textContent = `Konto ${account.slice(0,10)}… — ETH: ${toDec(eth)}, ANT: ${toDec(ant)}`;
  } catch (e) {
    $("balances").textContent = "Guthaben-Fehler: " + e;
  }
};

$("upload").onclick = async () => {
  try {
    const file = $("upload-file").files[0];
    if (!file) throw new Error("keine Datei gewählt");
    const manifest = await fetch($("manifest").value).then(r => r.json());
    const data = new Uint8Array(await file.arrayBuffer());
    const [ip, port] = $("node-addr").value.trim().split(":");
    const t0 = performance.now();
    log(`Verbinde zu ${ip}:${port} …`);
    const client = await WasmClient.connect(ip, Number(port), $("cert-hash").value.trim(), $("peer-id").value.trim());
    log(`PQC-Tunnel steht. Lade ${data.length} Bytes hoch (self-encrypt, Quotes, Zahlung, PUT) …`);
    const payer = await choosePayer(manifest);
    const address = await client.upload(data, manifest.evm.payment_token_address.replace(/^0x/, ""), manifest.evm.payment_vault_address.replace(/^0x/, ""), payer);
    const secs = ((performance.now() - t0) / 1000).toFixed(2);
    log(`Upload fertig in ${secs}s. Datei-Adresse: ${address}`, "ok");
    $("address").value = address;
    window.__uploadAddress = address;
    window.__uploadDone = true;
  } catch (e) {
    log(`Upload-Fehler: ${e}`, "err");
    window.__uploadError = String(e);
  }
};
</script>
</body>
</html>
